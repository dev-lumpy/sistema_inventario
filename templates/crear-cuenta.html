{% load static %} 
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · Sistema Taller</title>

      <link rel="stylesheet" href="/static/css/css2">
      <link rel="stylesheet" href="/static/css/all.min.css">
 
<style>
  :root{
    --navy: #16233d;
    --navy-dark: #0e1728;
    --blue: #2f6fed;
    --blue-dark: #234fb5;
    --amber: #f2994a;
    --green: #2ea86b;
    --red: #e0483e;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text-main: #1c2536;
    --text-muted: #7a8499;
    --border: #e6e9f2;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height: 100vh;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  :focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }

  .register-card{
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(15, 26, 46, .08);
  }

  /* ===== Cabecera navy, mismo patrón de siempre ===== */
  .register-top{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff;
    padding: 32px 34px 26px;
    text-align:center;
  }

  .register-icon{
    width: 60px; height: 60px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: rgba(47,111,237,.15);
    border: 1px solid rgba(47,111,237,.35);
    color: #7ea1f7;
    display:flex; align-items:center; justify-content:center;
    font-size: 1.5rem;
  }

  .register-tag{
    font-size: .76rem;
    font-weight: 700;
    letter-spacing: .5px;
    color: rgba(255,255,255,.55);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .register-top h1{
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
  }

  /* ===== Cuerpo / formulario ===== */
  .register-body{
    padding: 30px 34px 32px;
  }

  .field{
    margin-bottom: 18px;
  }

  .field label{
    display:block;
    font-size: .82rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
  }

  .input-wrap{
    position: relative;
    display:flex;
    align-items:center;
  }

  .input-wrap i.field-icon{
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    font-size: .9rem;
  }

  .input-wrap input{
    width: 100%;
    padding: 11px 14px 11px 40px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: .92rem;
    color: var(--text-main);
    background: var(--bg);
    transition: border-color .15s ease, background .15s ease;
  }

  .input-wrap input:focus{
    outline: none;
    border-color: var(--blue);
    background: #fff;
  }

  .input-wrap input.error{ border-color: var(--red); }
  .input-wrap input.valid{ border-color: var(--green); }

  .toggle-pass{
    position: absolute;
    right: 14px;
    color: var(--text-muted);
    cursor: pointer;
    background:none;
    border:none;
    font-size: .9rem;
    padding: 0;
  }

  .field-error{
    display: none;
    color: var(--red);
    font-size: .78rem;
    font-weight: 600;
    margin-top: 6px;
  }
  .field-error.show{ display:block; }

  .field-hint{
    font-size: .76rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* ===== Indicador de fuerza de contraseña ===== */
  .strength-bar{
    display:flex;
    gap: 5px;
    margin-top: 8px;
  }
  .strength-bar span{
    flex:1;
    height: 4px;
    border-radius: 4px;
    background: var(--border);
    transition: background .15s ease;
  }
  .strength-bar.weak span:nth-child(1){ background: var(--red); }
  .strength-bar.medium span:nth-child(1),
  .strength-bar.medium span:nth-child(2){ background: var(--amber); }
  .strength-bar.strong span{ background: var(--green); }

  .strength-label{
    font-size: .76rem;
    font-weight: 700;
    margin-top: 6px;
  }
  .strength-label.weak{ color: var(--red); }
  .strength-label.medium{ color: var(--amber); }
  .strength-label.strong{ color: var(--green); }

  .btn-register{
    width: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: 9px;
    border: none;
    background: var(--blue);
    color:#fff;
    font-family: inherit;
    font-weight: 700;
    font-size: .95rem;
    cursor: pointer;
    margin-top: 6px;
    transition: filter .15s ease, transform .05s ease;
  }
  .btn-register:hover:not(:disabled){ filter: brightness(1.08); }
  .btn-register:active{ transform: translateY(1px); }
  .btn-register:disabled{ opacity:.65; cursor:not-allowed; }

  .btn-register i.fa-spin{ display:none; }
  .btn-register.loading i.fa-solid:not(.fa-spin){ display:none; }
  .btn-register.loading i.fa-spin{ display:inline-block; }

  .form-msg{
    margin-top: 16px;
    padding: 11px 14px;
    border-radius: 8px;
    font-size: .84rem;
    font-weight: 600;
    text-align:center;
    display:none;
  }
  .form-msg.show{ display:block; }
  .form-msg.ok{ background: rgba(46,168,107,.1); color: var(--green); }
  .form-msg.fail{ background: rgba(224,72,62,.1); color: var(--red); }

  .register-footer{
    margin-top: 22px;
    text-align:center;
    font-size: .82rem;
    color: var(--text-muted);
  }
  .register-footer a{
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
  }
  .register-footer a:hover{ text-decoration: underline; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="register-card">
  <div class="register-top">
    <div class="register-icon"><i class="fa-solid fa-user-plus"></i></div>
    <div class="register-tag">Sistema Taller</div>
    <h1>Crear cuenta</h1>
  </div>

  <div class="register-body">
    <form id="registerForm" novalidate>

      <div class="field">
        <label for="username">Nombre de usuario</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="username" name="username" placeholder="Ej: mecanico_juan" autocomplete="username">
        </div>
        <div class="field-error" id="usernameError">Ingresá un nombre de usuario.</div>
      </div>

      <div class="field">
        <label for="email">Correo Gmail</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope field-icon"></i>
          <input type="email" id="email" name="email" placeholder="tucorreo@gmail.com" autocomplete="email">
        </div>
        <div class="field-error" id="emailError">Ingresá un correo válido que termine en @gmail.com.</div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-pass" id="togglePass"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="field-error" id="passwordError">La contraseña debe tener al menos 8 caracteres.</div>

        <div class="strength-bar" id="strengthBar">
          <span></span><span></span><span></span>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <div class="field">
        <label>Rol</label>
        <div style="display:flex;gap:16px;margin-top:4px">
          <label style="display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer">
            <input type="radio" name="rol" value="vendedor" checked> Vendedor
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer">
            <input type="radio" name="rol" value="administrador"> Administrador
          </label>
        </div>
      </div>

       <div class="field" id="adminField">
          <label for="adminUsername">Administrador</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user-tie field-icon"></i>

            <!-- Input visible: el usuario escribe el username -->
            <input
              type="text"
              id="adminUsername"
              name="adminUsername"
              placeholder="Nombre de usuario del administrador"
              autocomplete="off"
            >

            <!-- Input oculto: guarda el ID real del admin seleccionado -->
            <input type="hidden" id="adminId" name="adminId">
          </div>

          <div class="field-error" id="adminError">Seleccioná un administrador.</div>
          <div id="adminResults" class="admin-results"></div>
          <div id="adminSelected" class="admin-selected"></div>
        </div>
      <button type="submit" class="btn-register" id="btnRegister">
        <i class="fa-solid fa-user-plus"></i>
        <i class="fa-solid fa-spinner fa-spin"></i>
        <span>Crear cuenta</span>
      </button>

      <div class="form-msg" id="formMsg"></div>
    </form>

    <div class="register-footer">
      ¿Ya tenés cuenta? <a href="/">Iniciar sesión</a>
    </div>
  </div>
</div>

<script src="{% static 'js/crear-cuenta.js' %}"></script>

</body>
</html>
